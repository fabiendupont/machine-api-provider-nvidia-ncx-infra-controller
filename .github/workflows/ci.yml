name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller

      - name: Checkout NVIDIA infra-controller
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/infra-controller
          path: NVIDIA/infra-controller

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller

      - name: Checkout NVIDIA infra-controller
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/infra-controller
          path: NVIDIA/infra-controller

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller/go.mod

      - name: Build
        run: go build ./...
        working-directory: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller

      - name: Checkout NVIDIA infra-controller
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/infra-controller
          path: NVIDIA/infra-controller

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller/go.mod

      - name: Setup envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Run tests
        working-directory: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller
        run: |
          KUBEBUILDER_ASSETS="$(setup-envtest use --bin-dir /tmp/envtest -p path)" \
            go test ./... -coverprofile=cover.out

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller/cover.out
